<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-fr="Composition du Conseil" data-ar="تشكيلة المجلس">Composition du Conseil</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --line-color: var(--couleur-primaire);
            /* Darker blue from theme */
            --line-thickness: 3px;
            /* Thicker lines */
            --box-bg: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            /* Gradient background */
            --box-border: var(--couleur-primaire);
            /* Deep Blue from theme */
            --box-text: var(--couleur-texte);
            /* Dark Grey-Blue from theme */
            --page-bg-color: linear-gradient(135deg, #f7f9fb 0%, #e9ecef 100%);
            /* Gradient background */
            --president-height: 80px;
            /* Estimated height of president box */
            --other-box-width: 160px;
            --other-box-height: 110px;
            --president-bg: linear-gradient(135deg, #004a8c 0%, #0066cc 100%);
            /* Blue gradient for president */
            --secretariat-bg: linear-gradient(135deg, #004a8c 0%, #0066cc 100%);
            /* Blue gradient for secretariat */
            --vp-bg: linear-gradient(135deg, #004a8c 0%, #0066cc 100%);
            /* Blue gradient for VPs */
            --committee-bg: linear-gradient(135deg, #004a8c 0%, #0066cc 100%);
            /* Blue gradient for committees */
        }

        body {
            font-family: 'Inter', sans-serif;
            /* From theme's body font */
            background: var(--page-bg-color);
            margin: 0;
            padding: 0;
        }

        .page-header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #004a8c 0%, #0066cc 100%);
            color: white;
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .chart-container {
            padding: 50px;
            display: flex;
            justify-content: center;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            margin: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .organigramme {
            position: relative;
            width: 1000px;
            /* Increased width */
            height: 750px;
            /* Increased height */
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.05);
        }

        .org-box {
            background: var(--box-bg);
            border: 2px solid var(--box-border);
            border-radius: 15px;
            /* More rounded corners */
            padding: 25px;
            /* More padding */
            text-align: center;
            position: absolute;
            z-index: 1;
            /* Ensure boxes are above SVG lines */
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            /* Enhanced shadow */
            transition: all 0.3s ease;
            cursor: pointer;
        }



        .org-box h4 {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            /* From theme's heading font */
            font-weight: 700;
            /* From theme's heading font */
            color: var(--box-text);
            font-size: 0.9rem;
            line-height: 1.2;
        }

        /* President box */
        .president {
            background: var(--president-bg);
            color: white;
            min-width: 320px;
            padding: 25px;
        }

        .president h4 {
            color: white;
            font-size: 1.2rem;
        }

        /* Secretariat boxes */
        .sec-conseil,
        .vise-sec {
            background: var(--secretariat-bg);
            color: white;
        }

        .sec-conseil h4,
        .vise-sec h4 {
            color: white;
        }

        /* VP boxes */
        .vise-1,
        .vise-2,
        .vise-3 {
            background: var(--vp-bg);
            color: white;
        }

        .vise-1 h4,
        .vise-2 h4,
        .vise-3 h4 {
            color: white;
        }

        /* Committee boxes */
        .comite-1,
        .comite-2,
        .comite-3 {
            background: var(--committee-bg);
            color: white;
        }

        .comite-1 h4,
        .comite-2 h4,
        .comite-3 h4 {
            color: white;
        }

        /* Adjustments for square boxes (except president) */
        .org-box:not(.president) {
            width: var(--other-box-width);
            /* Fixed width */
            height: var(--other-box-height);
            /* Fixed height */
            padding: 10px;
            /* Adjusted padding for square appearance */
            min-width: auto;
            /* Remove min-width override */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 0;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: modalopen 0.3s ease-out;
        }

        @keyframes modalopen {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }

        .modal-body {
            padding: 20px;
            text-align: center;
        }

        .person-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 5px solid var(--couleur-primaire);
        }

        #person-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            color: var(--couleur-texte);
            margin: 0;
        }


        /* --- Box Positioning (Recalculated for new dimensions and spacing) --- */
        /* President */
        .president {
            top: 0;
            left: 34%;
        }

        /* Secretariat */
        .sec-conseil {
            top: 120px;
            left: 0;
        }

        .vise-sec {
            top: 280px;
            left: 0;
        }

        /* VPs */
        .vise-1 {
            top: 400px;
            right: 0;
        }

        .vise-2 {
            top: 400px;
            left: 42%;
        }

        .vise-3 {
            top: 400px;
            left: 100px;
        }

        /* Committees */
        .comite-1 {
            top: 600px;
            right: 0;
        }

        .comite-2 {
            top: 600px;
            left: 42%;
        }

        .comite-3 {
            top: 600px;
            left: 100px;
        }

        /* SVG for lines */
        .connectors {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            /* Ensures lines are behind boxes */
            overflow: visible;
            /* Allow lines to extend if needed */
        }

        .org-line {
            stroke: var(--line-color);
            /* Lines match theme primary color */
            stroke-width: var(--line-thickness);
            fill: none;
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>
    <main>
        <div class="page-header">
            <h1 data-fr="Composition du Conseil" data-ar="تشكيلة المجلس">Composition du Conseil</h1>
        </div>

        <div class="chart-container">
            <div class="organigramme">
                <!-- Boxes -->
                <div class="org-box president" data-name-fr="Président" data-name-ar="الرئيس"
                    data-image="president-fixed.png"><i class="fas fa-crown"></i>
                    <h4 data-fr="Président" data-ar="الرئيس">Président</h4>
                </div>
                <div class="org-box sec-conseil" data-name-fr="Secrétaire de conseil" data-name-ar="كاتب المجلس"
                    data-image="بويعلاوي محمد.JPG"><i class="fas fa-user-tie"></i>
                    <h4 data-fr="Secrétaire de conseil" data-ar="كاتب المجلس">Secrétaire de conseil</h4>
                </div>
                <div class="org-box vise-sec" data-name-fr="Vice de secrétaire" data-name-ar="نائب كاتب المجلس"
                    data-image="الراضي  كريم.JPG"><i class="fas fa-user-check"></i>
                    <h4 data-fr="Vice de secrétaire" data-ar="نائب كاتب المجلس">Vice de secrétaire</h4>
                </div>
                <div class="org-box vise-1" data-name-fr="Vice 1" data-name-ar="النائب الأول"
                    data-image="Farid bntaha.jpg"><i class="fas fa-user"></i>
                    <h4 data-fr="Vice 1" data-ar="النائب الأول">Vice 1</h4>
                </div>
                <div class="org-box vise-2" data-name-fr="Vice 2" data-name-ar="النائب الثاني"
                    data-image="اسمهان نصيري النائبة الثانية.jpg"><i class="fas fa-user"></i>
                    <h4 data-fr="Vice 2" data-ar="النائب الثاني">Vice 2</h4>
                </div>
                <div class="org-box vise-3" data-name-fr="Vice 3" data-name-ar="النائب الثالث"
                    data-image="خالد عزوزي.JPG"><i class="fas fa-user"></i>
                    <h4 data-fr="Vice 3" data-ar="النائب الثالث">Vice 3</h4>
                </div>
                <div class="org-box comite-1" data-name-fr="Président du comité 1" data-name-ar="رئيس اللجنة الأولى"
                    data-image="عبد القادر كريمي.jpg"><i class="fas fa-users"></i>
                    <h4 data-fr="Président du comité 1" data-ar="رئيس اللجنة الأولى">Président du comité 1</h4>
                </div>
                <div class="org-box comite-2" data-name-fr="Président du comité 2" data-name-ar="رئيس اللجنة الثانية"
                    data-image="فريدة النجاوي.JPG"><i class="fas fa-users"></i>
                    <h4 data-fr="Président du comité 2" data-ar="رئيس اللجنة الثانية">Président du comité 2</h4>
                </div>
                <div class="org-box comite-3" data-name-fr="Président du comité 3" data-name-ar="رئيس اللجنة الثالثة"
                    data-image="جمال زريوحي.JPG"><i class="fas fa-users"></i>
                    <h4 data-fr="Président du comité 3" data-ar="رئيس اللجنة الثالثة">Président du comité 3</h4>
                </div>

                <svg class="connectors" width="100%" height="100%" viewBox="0 0 1000 750">
                    <!-- Path definitions for elbow connectors -->

                    <!-- Common Line Style -->
                    <defs>
                        <style type="text/css">
                            <![CDATA[
                            .org-line {
                                stroke: var(--line-color);
                                stroke-width: var(--line-thickness);
                                fill: none;
                            }
                            ]]>
                        </style>
                    </defs>

                    <!-- President to main vertical spine -->
                    <!-- From President bottom edge (450, 80) to split point for Secretariat (450, 150) -->
                    <path d="M 450 80 L 450 150" class="org-line" />

                    <!-- Secretariat Branch -->
                    <!-- From main spine (500,150) horizontal to Secrétaire de conseil left edge (0 + half_width_box = 75) -->
                    <path d="M 500 150 L 75 150" class="org-line" />
                    <!-- Vertical from Secrétaire de conseil bottom (75, 120+100=220) to Vise de secrétaire top (75, 280) -->
                    <path d="M 75 220 L 75 280" class="org-line" />

                    <!-- Main vertical spine continues to VP Bus -->
                    <path d="M 500 150 L 500 370" class="org-line" />

                    <!-- VP Horizontal Bus Line (from X_VP_BUS_LEFT to X_VP_BUS_RIGHT at Y_VP_BUS) -->
                    <path d="M 175 370 L 925 370" class="org-line" />

                    <!-- Vertical lines from VP Bus to Vise boxes (connecting to bottom) -->
                    <path d="M 175 370 L 175 500" class="org-line" /> <!-- Vise 3 -->
                    <path d="M 500 370 L 500 500" class="org-line" /> <!-- Vise 2 -->
                    <path d="M 925 370 L 925 500" class="org-line" /> <!-- Vise 1 -->

                    <!-- Vertical lines from Vise boxes to Comite boxes (from bottom to bus) -->


                    <!-- Horizontal Committee bus (crossing vertical lines) -->




                </svg>

            </div>
        </div>

        <!-- Modal for person details -->
        <div id="person-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div class="modal-body">
                    <img id="person-image" src="" alt="Person Image" class="person-image">
                    <h2 id="person-name"></h2>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadHeaderFooter();

            // Modal functionality
            const modal = document.getElementById('person-modal');
            const modalImage = document.getElementById('person-image');
            const modalName = document.getElementById('person-name');
            const closeBtn = document.querySelector('.close');

            // Add click event to all org-boxes
            document.querySelectorAll('.org-box').forEach(box => {
                box.addEventListener('click', () => {
                    const lang = localStorage.getItem('language') || 'fr';
                    const name = box.getAttribute(`data-name-${lang}`);
                    const image = box.getAttribute('data-image');

                    if (name && image) {
                        modalName.textContent = name;
                        modalImage.src = image;
                        modal.style.display = 'block';
                    }
                });
            });

            // Close modal when clicking close button
            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });

            // Close modal when clicking outside
            window.addEventListener('click', (event) => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>

</html>
