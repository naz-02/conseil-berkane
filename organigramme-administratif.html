<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-fr="Organigramme Administratif | Conseil Provincial de Berkane" data-ar="الهيكل التنظيمي الإداري | المجلس الإقليمي لبركان">Organigramme Administratif | Conseil Provincial de Berkane</title>
    <meta name="description" content="Découvrez l'organigramme administratif et la structure du Conseil Provincial de Berkane.">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@700;800&amp;display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --line-color: var(--couleur-primaire); /* Darker blue from theme */
            --line-thickness: 3px; /* Thicker lines */
            --box-bg: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%); /* Gradient background */
            --box-border: var(--couleur-primaire); /* Deep Blue from theme */
            --box-text: var(--couleur-texte); /* Dark Grey-Blue from theme */
            --page-bg-color: linear-gradient(135deg, #f7f9fb 0%, #e9ecef 100%); /* Gradient background */
            --president-height: 80px; /* Estimated height of president box */
            --other-box-width: 160px;
            --other-box-height: 110px;
            --president-bg: linear-gradient(135deg, #004a8c 0%, #0066cc 100%); /* Blue gradient for president */
            --service-bg: linear-gradient(135deg, #004a8c 0%, #0066cc 100%); /* Blue gradient for services */
        }

        body {
            font-family: 'Inter', sans-serif; /* From theme's body font */
            background: var(--page-bg-color);
            margin: 0;
            padding: 0;
        }

        .page-header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #004a8c 0%, #0066cc 100%);
            color: white;
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .chart-container {
            padding: 50px;
            display: flex;
            justify-content: center;
            background: rgba(255,255,255,0.8);
            border-radius: 20px;
            margin: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .organigramme {
            position: relative;
            width: 1000px; /* Increased width */
            height: 750px; /* Increased height */
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        .org-box {
            background: var(--box-bg);
            border: 2px solid var(--box-border);
            border-radius: 15px; /* More rounded corners */
            padding: 25px; /* More padding */
            text-align: center;
            position: absolute;
            z-index: 1; /* Ensure boxes are above SVG lines */
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); /* Enhanced shadow */
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .org-box h4 {
            margin: 0;
            font-family: 'Montserrat', sans-serif; /* From theme's heading font */
            font-weight: 700; /* From theme's heading font */
            color: var(--box-text);
            font-size: 0.9rem;
            line-height: 1.2;
        }

        /* President box */
        .president {
            background: var(--president-bg);
            color: white;
            min-width: 320px;
            padding: 25px;
        }

        .president h4 {
            color: white;
            font-size: 1.2rem;
        }

        /* Service boxes */
        .service-technique, .service-admin, .service-financier {
            background: var(--service-bg);
            color: white;
        }

        .service-technique h4, .service-admin h4, .service-financier h4 {
            color: white;
        }

        /* Department boxes */
        .service-1, .service-2, .service-3, .service-4 {
            background: var(--service-bg);
            color: white;
        }

        .service-1 h4, .service-2 h4, .service-3 h4, .service-4 h4 {
            color: white;
        }

        /* Adjustments for square boxes (except president) */
        .org-box:not(.president) {
            width: var(--other-box-width); /* Fixed width */
            height: var(--other-box-height); /* Fixed height */
            padding: 10px; /* Adjusted padding for square appearance */
            min-width: auto; /* Remove min-width override */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 0;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: modalopen 0.3s ease-out;
        }

        @keyframes modalopen {
            from {opacity: 0; transform: scale(0.8);}
            to {opacity: 1; transform: scale(1);}
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }

        .modal-body {
            padding: 20px;
            text-align: center;
        }

        .person-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 5px solid var(--couleur-primaire);
        }

        #person-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            color: var(--couleur-texte);
            margin: 0;
        }

        /* --- Box Positioning --- */
        /* President */
        .president { top: 0; left: 34%; }
        /* Services */
        .service-technique { top: 120px; left: 130px; }
        .service-admin { top: 120px; left: 420px; }
        .service-financier { top: 120px; left: 710px; }
        /* Departments */
        .service-1 { top: 400px; left: 0; }
        .service-2 { top: 400px; left: 25%; }
        .service-3 { top: 400px; left: 50%; }
        .service-4 { top: 400px; right: 0; }

        /* SVG for lines */
        .connectors {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0; /* Ensures lines are behind boxes */
            overflow: visible; /* Allow lines to extend if needed */
        }
        .org-line {
            stroke: var(--line-color); /* Lines match theme primary color */
            stroke-width: var(--line-thickness);
            fill: none;
            animation: drawLine 2s ease-in-out;
        }

        .dotted-line {
            stroke-dasharray: 5, 5; /* Dotted line */
        }

        @keyframes drawLine {
            to { stroke-dashoffset: -15; }
        }

    </style>
</head>
<body>

    <div id="header-placeholder"></div>
    <main>
        <div class="page-header">
            <h1 data-fr="Organigramme Administratif" data-ar="الهيكل التنظيمي الإداري">Organigramme Administratif</h1>
        </div>

        <div class="chart-container">
             <div class="organigramme">
                <!-- Boxes -->
                <div class="org-box president" data-name-fr="Présidence" data-name-ar="الرئاسة" title="Cliquez pour voir les détails"><h4 data-fr="Présidence" data-ar="الرئاسة">Présidence</h4></div>
                <div class="org-box service-technique" data-name-fr="Direction des Affaires Présidentielles et du Conseil" data-name-ar="مديرية شؤون الرئاسة والمجلس" title="Cliquez pour voir les détails"><h4 data-fr="Direction des Affaires Présidentielles et du Conseil" data-ar="مديرية شؤون الرئاسة والمجلس">Direction des Affaires Présidentielles et du Conseil</h4></div>
                <div class="org-box service-admin" data-name-fr="Direction Générale des Services" data-name-ar="المديرية العامة للمصالح" title="Cliquez pour voir les détails"><h4 data-fr="Direction Générale des Services" data-ar="المديرية العامة للمصالح">Direction Générale des Services</h4></div>
                <div class="org-box service-financier" data-name-fr="Secrétariat Particulier" data-name-ar="الكتابة الخاصة" title="Cliquez pour voir les détails"><h4 data-fr="Secrétariat Particulier" data-ar="الكتابة الخاصة">Secrétariat Particulier</h4></div>
                <div class="org-box service-1" data-name-fr="Service 1" data-name-ar="مصلحة 1" title="Cliquez pour voir les détails"><h4 data-fr="Service 1" data-ar="مصلحة 1">Service 1</h4></div>
                <div class="org-box service-2" data-name-fr="Service 2" data-name-ar="مصلحة 2" title="Cliquez pour voir les détails"><h4 data-fr="Service 2" data-ar="مصلحة 2">Service 2</h4></div>
                <div class="org-box service-3" data-name-fr="Service 3" data-name-ar="مصلحة 3" title="Cliquez pour voir les détails"><h4 data-fr="Service 3" data-ar="مصلحة 3">Service 3</h4></div>
                <div class="org-box service-4" data-name-fr="Service 4" data-name-ar="مصلحة 4" title="Cliquez pour voir les détails"><h4 data-fr="Service 4" data-ar="مصلحة 4">Service 4</h4></div>

                <svg class="connectors" width="100%" height="100%" viewBox="0 0 1000 750">
                    <!-- Path definitions for elbow connectors -->

                    <!-- Common Line Style -->
                    <defs>
                        <style>
                            .org-line {
                                stroke: var(--line-color);
                                stroke-width: var(--line-thickness);
                                fill: none;
                            }
                        </style>
                    </defs>

                    <!-- Dotted line connecting services -->
                    <path d="M 210 170 L 790 170" class="org-line dotted-line" />

                    <!-- President direct connections to Services -->
                    <path d="M 500 80 L 500 120" class="org-line" /> <!-- to Service Admin -->
                    <path d="M 500 80 L 500 100 L 210 100 L 210 120" class="org-line" /> <!-- to Service Technique -->
                    <path d="M 500 80 L 500 100 L 790 100 L 790 120" class="org-line" /> <!-- to Service Financier -->


                    <!-- Vertical spine to departments -->
                    <path d="M 500 230 L 500 340" class="org-line" />

                    <!-- Departments horizontal bus -->
                    <path d="M 80 340 L 920 340" class="org-line" />

                    <!-- Dotted line at text height -->
                    <path d="M 80 460 L 920 460" class="org-line dotted-line" />

                    <!-- Vertical lines from bus to departments -->
                    <path d="M 80 340 L 80 450" class="org-line" /> <!-- Service 1 -->
                    <path d="M 330 340 L 330 450" class="org-line" /> <!-- Service 2 -->
                    <path d="M 580 340 L 580 450" class="org-line" /> <!-- Service 3 -->
                    <path d="M 920 340 L 920 450" class="org-line" /> <!-- Service 4 -->


                </svg>

             </div>
        </div>

        <!-- Modal for person details -->
        <div id="person-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div class="modal-body">
                    <img id="person-image" src="" alt="Person Image" class="person-image">
                    <h2 id="person-name"></h2>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadHeaderFooter();

            // Modal functionality
            const modal = document.getElementById('person-modal');
            const modalImage = document.getElementById('person-image');
            const modalName = document.getElementById('person-name');
            const closeBtn = document.querySelector('.close');

            // Add click event to all org-boxes
            document.querySelectorAll('.org-box').forEach(box => {
                box.addEventListener('click', () => {
                    const lang = localStorage.getItem('language') || 'fr';
                    const name = box.getAttribute(`data-name-${lang}`);

                    if (name) {
                        modalName.textContent = name;
                        modalImage.style.display = 'none'; // Hide image for services
                        modal.style.display = 'block';
                    }
                });
            });

            // Close modal when clicking close button
            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });

            // Close modal when clicking outside
            window.addEventListener('click', (event) => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
    </script>

</body>
</html>
