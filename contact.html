<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-fr="Contact | Conseil Provincial de Berkane" data-ar="إتصل بنا | المجلس الإقليمي لبركان">Contact | Conseil Provincial de Berkane</title>
    <meta name="description" content="Contactez le Conseil Provincial de Berkane pour toute question, suggestion ou réclamation. Retrouvez nos coordonnées et un formulaire de contact.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styles spécifiques à cette page */
        .page-header {
            background: var(--couleur-primaire);
            color: var(--couleur-blanc);
            padding: 40px 5%;
            text-align: center;
            margin-bottom: 40px;
        }
        .page-header h1 {
            color: var(--couleur-blanc);
            margin-bottom: 0;
        }
        .content-section {
            padding: 40px 20px;
            margin-bottom: 40px;
            background-color: var(--couleur-card-bg);
            border-radius: 8px;
            box-shadow: var(--ombre-douce);
        }
        .contact-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 30px;
        }
        .contact-info-item {
            flex: 1 1 300px;
            text-align: center;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            background-color: var(--couleur-arriere-plan);
        }
        .contact-info-item h3 {
            color: var(--couleur-secondaire);
            margin-bottom: 10px;
        }
        .contact-info-item p {
            margin-bottom: 5px;
        }
        .contact-form {
            background-color: var(--couleur-arriere-plan);
            padding: 30px;
            border-radius: 8px;
            box-shadow: var(--ombre-douce);
        }
        .contact-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--couleur-texte);
        }
        .contact-form input[type="text"],
        .contact-form input[type="email"],
        .contact-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }
        .contact-form textarea {
            min-height: 120px;
            resize: vertical;
        }
        .contact-form button {
            background-color: var(--couleur-primaire);
            color: var(--couleur-blanc);
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }
        .contact-form button:hover {
            background-color: var(--couleur-secondaire);
        }
        .localisation-map {
            margin-top: 30px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--ombre-douce);
        }
        .localisation-map iframe {
            width: 100%;
            height: 400px;
            border: 0;
        }
    </style>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
</head>
<body>

    <div id="header-placeholder"></div>
    
    <main>
        <div class="page-header">
            <h1 data-fr="Contactez-nous" data-ar="تواصل معنا">Contactez-nous</h1>
        </div>

        <section class="content-section">
            <h2 data-fr="Informations de Contact" data-ar="معلومات الاتصال">Informations de Contact</h2>
            <div class="contact-info">
                <div class="contact-info-item">
                    <h3 data-fr="Adresse" data-ar="العنوان">Adresse</h3>
                    <p><span data-fr="Caracucho, Rue de Londres, Berkane 63300" data-ar="كاراكشو، زنقة لندن, Berkane 63300">Caracucho, Rue de Londres, Berkane 63300</span></p>
                </div>
                <div class="contact-info-item">
                    <h3 data-fr="Téléphone" data-ar="الهاتف">Téléphone</h3>
                    <p data-fr="Téléphone" data-ar="الهاتف">+212 5 36 61 62 63</p>
                </div>
                <div class="contact-info-item">
                    <h3 data-fr="Email" data-ar="البريد الإلكتروني">Email</h3>
                    <p data-fr="Email" data-ar="البريد الإلكتروني">contact@cpberkane.ma</p>
                </div>
            </div>

            <div class="localisation-map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3270.548468593217!2d-2.3305494242449485!3d34.94285957283477!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd7823162c5757c3%3A0x1d25cb282953938c!2sConseil%20Provincial%20de%20Berkane!5e0!3m2!1sfr!2sma!4v1764280117847!5m2!1sfr!2sma" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>

        <section class="content-section">
            <h2 data-fr="Envoyez-nous un Message" data-ar="أرسل لنا رسالة">Envoyez-nous un Message</h2>
            <div class="contact-form">
                <form>
                    <label for="name" data-fr="Votre Nom :" data-ar="اسمك :">Votre Nom :</label>
                    <input type="text" id="name" name="name" data-fr-placeholder="Votre nom complet" data-ar-placeholder="اسمك الكامل" required>
                    
                    <label for="email" data-fr="Votre Email :" data-ar="بريدك الإلكتروني :">Votre Email :</label>
                    <input type="email" id="email" name="email" data-fr-placeholder="votre.email@example.com" data-ar-placeholder="بريدك الإلكتروني" required>
                    
                    <label for="subject" data-fr="Sujet :" data-ar="الموضوع :">Sujet :</label>
                    <input type="text" id="subject" name="subject" data-fr-placeholder="Sujet de votre message" data-ar-placeholder="موضوع رسالتك" required>
                    
                    <label for="message" data-fr="Votre Message :" data-ar="رسالتك :">Votre Message :</label>
                    <textarea id="message" name="message" data-fr-placeholder="Écrivez votre message ici..." data-ar-placeholder="اكتب رسالتك هنا..." required></textarea>
                    
                    <button type="submit" class="btn btn-primary" data-fr="Envoyer le Message" data-ar="إرسال الرسالة">Envoyer le Message</button>
                </form>
            </div>
        </section>

    </main>
    
    <div id="footer-placeholder"></div>
    
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contactForm = document.querySelector('.contact-form form');
            contactForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const subject = document.getElementById('subject').value;
                const message = document.getElementById('message').value;

                const mailtoLink = `mailto:contact@cpberkane.ma?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(`Nom: ${name}\nEmail: ${email}\n\nMessage:\n${message}`)}`;
                
                window.location.href = mailtoLink;
            });
        });
    </script>
</body>
</html>
